<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor.X — Vườn cây</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d1a;--surface:#0a1628;--border:rgba(0,210,200,.12);--accent:#00d2c8;--accent2:#00aaff;--a3:#00e5a0;--glow:rgba(0,210,200,.3);--text:#e8f4f8;--muted:#5a7a90;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.bg-fx{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(0,229,160,.07),transparent 60%),radial-gradient(ellipse 60% 40% at 50% 0%,rgba(0,210,200,.05),transparent 50%),var(--bg);}
.content{position:relative;z-index:1;text-align:center;padding:2rem;}
.back{position:fixed;top:1.5rem;left:1.5rem;z-index:10;display:flex;align-items:center;gap:.5rem;
  color:var(--muted);text-decoration:none;font-size:.85rem;padding:.4rem .8rem;
  border:1px solid var(--border);border-radius:8px;background:rgba(10,22,40,.8);backdrop-filter:blur(10px);transition:all .2s;}
.back:hover{color:var(--accent);border-color:rgba(0,210,200,.3);}
.plant-big{font-size:10rem;line-height:1;margin-bottom:1rem;display:block;
  filter:drop-shadow(0 0 40px rgba(0,210,200,.3)) drop-shadow(0 0 80px rgba(0,229,160,.2));
  animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1) translateY(0);}50%{transform:scale(1.06) translateY(-8px);}}
.ground{width:300px;height:12px;background:linear-gradient(90deg,transparent,rgba(0,210,200,.2),rgba(0,229,160,.3),rgba(0,210,200,.2),transparent);
  border-radius:50%;margin:0 auto 2rem;filter:blur(4px);}
.plant-name{font-family:'Syne',sans-serif;font-weight:800;font-size:2.5rem;margin-bottom:.5rem;
  background:linear-gradient(90deg,var(--accent),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.plant-sub{color:var(--muted);font-size:1rem;margin-bottom:2rem;}
.stats-mini{display:flex;gap:1.5rem;justify-content:center;margin-bottom:2rem;}
.stat-m{background:rgba(10,22,40,.8);border:1px solid var(--border);border-radius:12px;padding:.75rem 1.25rem;backdrop-filter:blur(10px);}
.stat-m-v{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-m-l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.progress-bar{width:300px;margin:0 auto;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--a3));border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.progress-label{font-size:.8rem;color:var(--muted);margin-top:.5rem;}
.msg-box{margin-top:2rem;padding:1rem 2rem;background:rgba(10,22,40,.8);border:1px solid var(--border);
  border-radius:12px;backdrop-filter:blur(10px);max-width:320px;font-size:.9rem;line-height:1.5;}
/* particles */
.leaf{position:fixed;font-size:1.2rem;opacity:0;animation:leaf-fall var(--d,8s) ease-in infinite;animation-delay:var(--dl,0s);}
@keyframes leaf-fall{0%{opacity:0;transform:translateY(-20px) rotate(0deg);}20%{opacity:.6;}100%{opacity:0;transform:translateY(100vh) rotate(360deg);}}
</style>
</head>
<body>
<div class="bg-fx"></div>

<a class="back" href="/dashboard">← Dashboard</a>

<div class="content">
  <span class="plant-big" id="plant-emoji">🌱</span>
  <div class="ground"></div>
  <div class="plant-name" id="plant-name">Đang tải...</div>
  <div class="plant-sub" id="plant-sub">—</div>
  <div class="stats-mini">
    <div class="stat-m">
      <div class="stat-m-v" id="total-ml">—</div>
      <div class="stat-m-l">Đã uống (ml)</div>
    </div>
    <div class="stat-m">
      <div class="stat-m-v" id="pct">—</div>
      <div class="stat-m-l">Hoàn thành</div>
    </div>
    <div class="stat-m">
      <div class="stat-m-v" id="streak">—</div>
      <div class="stat-m-l">Ngày liên tiếp</div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">0 / 0 ml</div>
  <div class="msg-box" id="msg-box">Đang tải dữ liệu...</div>
</div>

<script>
const STATES = {
  dry:     {emoji:'🪴',name:'Đang héo',sub:'Cây cần nước ngay!',msg:'😟 Bạn chưa uống đủ nước hôm nay. Hãy uống một ly ngay bây giờ để cứu cây nhé!'},
  growing: {emoji:'🌱',name:'Đang lớn',sub:'Cây đang phát triển dần',msg:'🌿 Tốt lắm! Cây đang lớn từng ngày. Hãy tiếp tục uống đều đặn để cây khỏe hơn.'},
  healthy: {emoji:'🌿',name:'Khỏe mạnh',sub:'Cây xanh tươi',msg:'💚 Cây đang rất khỏe mạnh! Bạn đang làm rất tốt. Tiếp tục giữ thói quen uống nước nhé!'},
  bloom:   {emoji:'🌸',name:'Nở rộ',sub:'Cây đạt đỉnh cao!',msg:'🎉 Xuất sắc! Bạn đã hoàn thành mục tiêu hôm nay. Cây đang nở rộ rực rỡ!'},
};

async function load() {
  const token = localStorage.getItem('token');
  if (!token) return window.location.href = '/app';
  try {
    const r = await fetch('/me/water/summary-today', {headers:{'Authorization':'Bearer '+token}});
    if (r.status===401) return window.location.href='/app';
    const d = await r.json();
    const s = STATES[d.plant_state] || STATES.dry;
    document.getElementById('plant-emoji').textContent = s.emoji;
    document.getElementById('plant-name').textContent = s.name;
    document.getElementById('plant-sub').textContent = s.sub;
    document.getElementById('total-ml').textContent = Math.round(d.total_ml).toLocaleString();
    document.getElementById('pct').textContent = Math.round(d.percent) + '%';
    document.getElementById('streak').textContent = d.streak_days + '🔥';
    document.getElementById('progress-fill').style.width = Math.min(d.percent,100) + '%';
    document.getElementById('progress-label').textContent = Math.round(d.total_ml).toLocaleString() + ' / ' + Math.round(d.target_ml).toLocaleString() + ' ml';
    document.getElementById('msg-box').textContent = s.msg;
    // Spawn leaves
    for(let i=0;i<10;i++){const l=document.createElement('div');l.className='leaf';
      l.textContent=['🍃','🌿','💧'][Math.floor(Math.random()*3)];
      l.style.cssText=`left:${Math.random()*100}%;top:${-10}%;--d:${6+Math.random()*10}s;--dl:${Math.random()*8}s`;
      document.body.appendChild(l);}
  } catch(e) { document.getElementById('msg-box').textContent = 'Lỗi tải dữ liệu'; }
}
load();
</script>
</body>
</html>
