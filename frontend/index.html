<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor.X — Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050d1a;
  --surface:   #0a1628;
  --border:    rgba(0,210,200,.15);
  --accent:    #00d2c8;
  --accent2:   #0af;
  --glow:      rgba(0,210,200,.35);
  --text:      #e8f4f8;
  --muted:     #6a8fa8;
  --danger:    #ff5c7a;
  --success:   #00e5a0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Animated background */
.bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(0,210,200,.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 20%, rgba(0,170,255,.06) 0%, transparent 60%),
    var(--bg);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: float 8s ease-in-out infinite;
  pointer-events: none;
}
.orb-1 { width:400px;height:400px; background:rgba(0,210,200,.05); top:-10%; left:-10%; animation-delay:0s; }
.orb-2 { width:300px;height:300px; background:rgba(0,170,255,.05); bottom:-10%; right:-5%; animation-delay:3s; }
.orb-3 { width:200px;height:200px; background:rgba(0,229,160,.04); top:40%; left:60%; animation-delay:5s; }

@keyframes float {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.05); }
}

/* Particles */
.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0;
  animation: particle-rise var(--dur, 6s) ease-in infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes particle-rise {
  0% { opacity:0; transform: translateY(0) translateX(0); }
  20% { opacity: .6; }
  100% { opacity:0; transform: translateY(-200px) translateX(var(--drift,20px)); }
}

/* Layout */
.container {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  padding: 1rem;
  animation: slide-up .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slide-up {
  from { opacity:0; transform:translateY(30px); }
  to   { opacity:1; transform:translateY(0); }
}

.logo {
  text-align: center;
  margin-bottom: 2rem;
}
.logo-icon {
  width: 64px; height: 64px;
  margin: 0 auto 1rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  box-shadow: 0 0 40px var(--glow);
  animation: pulse-logo 3s ease-in-out infinite;
}
@keyframes pulse-logo {
  0%,100% { box-shadow: 0 0 40px var(--glow); }
  50% { box-shadow: 0 0 60px rgba(0,210,200,.5), 0 0 80px rgba(0,210,200,.2); }
}
.logo h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.8rem;
  letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo p { color: var(--muted); font-size: .85rem; margin-top: .25rem; }

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03);
}

/* Tabs */
.tabs {
  display: flex;
  background: rgba(255,255,255,.03);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 1.75rem;
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: .55rem 1rem; border-radius: 7px;
  font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 500;
  color: var(--muted); transition: all .2s;
}
.tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #050d1a; font-weight: 700;
}

/* Forms */
.form { display: none; flex-direction: column; gap: 1rem; }
.form.active { display: flex; }

.field { display: flex; flex-direction: column; gap: .4rem; }
.field label { font-size: .8rem; color: var(--muted); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }

.input-wrap { position: relative; }
.input-wrap .icon {
  position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
  font-size: 1rem; color: var(--muted); pointer-events: none;
}
input, select {
  width: 100%; padding: .75rem .9rem .75rem 2.4rem;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .95rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
  appearance: none;
}
input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,210,200,.1);
}
input::placeholder { color: var(--muted); opacity: .6; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

.btn {
  width: 100%; padding: .85rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: 10px; cursor: pointer;
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
  color: #050d1a; letter-spacing: .02em;
  transition: opacity .2s, transform .1s, box-shadow .2s;
  position: relative; overflow: hidden; margin-top: .25rem;
}
.btn:hover { opacity: .92; box-shadow: 0 8px 30px var(--glow); }
.btn:active { transform: scale(.98); }
.btn.loading { pointer-events: none; opacity: .7; }
.btn.loading::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  animation: shimmer .8s infinite;
}
@keyframes shimmer {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}

.msg {
  padding: .7rem 1rem; border-radius: 8px; font-size: .85rem;
  display: none; align-items: center; gap: .5rem;
}
.msg.error   { display: flex; background: rgba(255,92,122,.1); border: 1px solid rgba(255,92,122,.3); color: var(--danger); }
.msg.success { display: flex; background: rgba(0,229,160,.1); border: 1px solid rgba(0,229,160,.3); color: var(--success); }

.link { text-align: center; margin-top: .75rem; font-size: .85rem; color: var(--muted); }
.link a { color: var(--accent); text-decoration: none; }
.link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Particles -->
<script>
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `left:${Math.random()*100}%;bottom:${Math.random()*30}%;--dur:${5+Math.random()*8}s;--delay:${Math.random()*6}s;--drift:${(Math.random()-.5)*60}px`;
    document.body.appendChild(p);
  }
</script>

<div class="container">
  <div class="logo">
    <div class="logo-icon">💧</div>
    <h1>Doctor.X</h1>
    <p>Smart Water Intake Platform</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- LOGIN -->
    <form class="form active" id="login-form">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input type="email" name="email" placeholder="you@email.com" required>
        </div>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn" id="login-btn">Đăng nhập</button>
      <div class="link"><a href="/forgot-password">Quên mật khẩu?</a></div>
    </form>

    <!-- REGISTER -->
    <form class="form" id="register-form">
      <div class="field">
        <label>Họ tên</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" name="full_name" placeholder="Nguyễn Văn A" required>
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input type="email" name="email" placeholder="you@email.com" required>
        </div>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" name="password" placeholder="Tối thiểu 8 ký tự" required minlength="8">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Giới tính</label>
          <div class="input-wrap">
            <span class="icon">⚥</span>
            <select name="gender">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Cân nặng (kg)</label>
          <div class="input-wrap">
            <span class="icon">⚖</span>
            <input type="number" name="weight_kg" placeholder="65" min="30" max="200">
          </div>
        </div>
      </div>
      <div class="field">
        <label>Chiều cao (cm)</label>
        <div class="input-wrap">
          <span class="icon">📏</span>
          <input type="number" name="height_cm" placeholder="170" min="100" max="250">
        </div>
      </div>
      <button type="submit" class="btn" id="register-btn">Tạo tài khoản</button>
    </form>
  </div>
</div>

<script>
const API = '';
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').classList.toggle('active', tab==='login');
  document.getElementById('register-form').classList.toggle('active', tab==='register');
  showMsg('', '');
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg' + (type ? ' ' + type : '');
  el.textContent = text;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.classList.toggle('loading', loading);
  btn.disabled = loading;
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  setLoading('login-btn', true);
  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `username=${encodeURIComponent(fd.get('email'))}&password=${encodeURIComponent(fd.get('password'))}`
    });
    const data = await r.json();
    if (!r.ok) return showMsg(data.detail || 'Đăng nhập thất bại', 'error');
    localStorage.setItem('token', data.access_token);
    showMsg('Đăng nhập thành công!', 'success');
    setTimeout(() => window.location.href = '/dashboard', 600);
  } catch { showMsg('Lỗi kết nối server', 'error'); }
  finally { setLoading('login-btn', false); }
});

document.getElementById('register-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    email: fd.get('email'), password: fd.get('password'),
    full_name: fd.get('full_name'), gender: fd.get('gender'),
    weight_kg: fd.get('weight_kg') ? +fd.get('weight_kg') : null,
    height_cm: fd.get('height_cm') ? +fd.get('height_cm') : null,
  };
  setLoading('register-btn', true);
  try {
    const r = await fetch('/auth/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) return showMsg(data.detail || 'Đăng ký thất bại', 'error');
    showMsg('Tài khoản đã được tạo! Đang chuyển hướng...', 'success');
    setTimeout(() => switchTab('login'), 1500);
  } catch { showMsg('Lỗi kết nối server', 'error'); }
  finally { setLoading('register-btn', false); }
});

// Auto-redirect if already logged in
if (localStorage.getItem('token')) window.location.href = '/dashboard';
</script>
</body>
</html>
