<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor.X — Đặt lại mật khẩu</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d1a;--surface:#0a1628;--border:rgba(0,210,200,.15);--accent:#00d2c8;--accent2:#00aaff;--text:#e8f4f8;--muted:#5a7a90;--danger:#ff5c7a;--success:#00e5a0;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 70% 30%,rgba(0,170,255,.05),transparent 55%),#050d1a;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:400px;margin:1rem;}
.logo{text-align:center;margin-bottom:2rem;}
.logo-icon{font-size:2.5rem;margin-bottom:.5rem;}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;text-align:center;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:var(--muted);font-size:.85rem;text-align:center;margin:.5rem 0 1.5rem;}
.field{margin-bottom:1rem;}
label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.4rem;}
input{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);opacity:.6;}
.btn{width:100%;padding:.85rem;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;
  color:#050d1a;font-size:1rem;cursor:pointer;transition:opacity .2s;margin-top:.5rem;}
.btn:hover{opacity:.9;}
.msg{padding:.7rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none;}
.msg.error{display:block;background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.3);color:var(--danger);}
.msg.success{display:block;background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);color:var(--success);}
.link{text-align:center;margin-top:1rem;font-size:.85rem;color:var(--muted);}
.link a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-icon">🔒</div><h1>Đặt lại mật khẩu</h1></div>
  <p class="sub">Nhập mật khẩu mới cho tài khoản của bạn.</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <div class="field"><label>Mật khẩu mới</label><input type="password" name="password" placeholder="Tối thiểu 8 ký tự" required minlength="8"></div>
    <div class="field"><label>Xác nhận mật khẩu</label><input type="password" name="confirm" placeholder="Nhập lại mật khẩu" required></div>
    <button type="submit" class="btn">Đặt lại mật khẩu</button>
  </form>
  <div class="link"><a href="/app">← Quay lại đăng nhập</a></div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) { document.getElementById('msg').className='msg error'; document.getElementById('msg').textContent='Token không hợp lệ'; document.getElementById('form').style.display='none'; }

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const msg = document.getElementById('msg');
  if (fd.get('password') !== fd.get('confirm')) { msg.className='msg error'; msg.textContent='Mật khẩu không khớp!'; return; }
  const r = await fetch('/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token, new_password: fd.get('password')})});
  const d = await r.json();
  if (!r.ok) { msg.className='msg error'; msg.textContent=d.detail||'Lỗi'; return; }
  msg.className='msg success'; msg.textContent='Đổi mật khẩu thành công! Đang chuyển về trang đăng nhập...';
  setTimeout(() => window.location.href='/app', 2000);
});
</script>
</body>
</html>
